name: Pulse
options:
  bundleIdPrefix: app.pulse
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  PulseCore:
    path: Packages/PulseCore
  PulseUI:
    path: Packages/PulseUI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.14.1"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"

targets:
  PulseMac:
    type: application
    platform: macOS
    sources:
      - PulseMac/Sources
      - PulseMac/Resources
    dependencies:
      - package: PulseCore
      - package: PulseUI
      - package: Sparkle
        product: Sparkle
      - package: TelemetryDeck
        product: TelemetryDeck
      - package: MCP
        product: MCP
    info:
      path: PulseMac/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 FFF"
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: true
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUScheduledCheckInterval: 86400
        TelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)
        # Longbridge OAuth fallback callback (bundle id doubles as the URL scheme,
        # keeping dev and release callbacks isolated)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
    entitlements:
      path: PulseMac/Pulse.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        # Loopback listener for the Longbridge OAuth redirect (primary callback path)
        # and the local MCP agent endpoint
        com.apple.security.network.server: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    postBuildScripts:
      - name: Embed Longbridge SDK Plugin
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-longbridge-plugin.sh"
    settings:
      base:
        MARKETING_VERSION: "0.15.8"
        CURRENT_PROJECT_VERSION: "1787242352"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_LANGUAGE: en
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
        TELEMETRYDECK_APP_ID: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_NAME: FFF
          BUNDLE_DISPLAY_NAME: FFF
          PRODUCT_BUNDLE_IDENTIFIER: app.pulse.mac.dev
          ENABLE_HARDENED_RUNTIME: false
          ENABLE_USER_SCRIPT_SANDBOXING: false
          # Keep direct Xcode builds on the daily app's persistent local signer too.
          # scripts/dev-mac.sh discovers this identity or a contributor's Apple identity.
          CODE_SIGN_IDENTITY: "Fight For Free Local Development"
          DEVELOPMENT_TEAM: ""
        Release:
          PRODUCT_NAME: FFF
          BUNDLE_DISPLAY_NAME: FFF
          PRODUCT_BUNDLE_IDENTIFIER: app.pulse.mac
