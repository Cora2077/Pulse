name: Pulse
options:
  bundleIdPrefix: app.pulse
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  PulseCore:
    path: Packages/PulseCore
  PulseUI:
    path: Packages/PulseUI
  PulseSync:
    path: Packages/PulseSync
  PulseMobile:
    path: Packages/PulseMobile
  PulseActivity:
    path: Packages/PulseActivity
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.14.1"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"

targets:
  PulseMac:
    type: application
    platform: macOS
    sources:
      - PulseMac/Sources
      - PulseMac/Resources
      - SharedAppSupport
    dependencies:
      - package: PulseCore
      - package: PulseUI
      - package: PulseSync
      - package: Sparkle
        product: Sparkle
      - package: TelemetryDeck
        product: TelemetryDeck
      - package: MCP
        product: MCP
    info:
      path: PulseMac/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 FFF"
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: true
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUScheduledCheckInterval: 86400
        TelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)
        # Longbridge OAuth fallback callback (bundle id doubles as the URL scheme,
        # keeping dev and release callbacks isolated)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
    entitlements:
      path: PulseMac/Pulse.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        # Loopback listener for the Longbridge OAuth redirect (primary callback path)
        # and the local MCP agent endpoint
        com.apple.security.network.server: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    postBuildScripts:
      - name: Embed Longbridge SDK Plugin
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-longbridge-plugin.sh"
    settings:
      base:
        MARKETING_VERSION: "0.15.8"
        CURRENT_PROJECT_VERSION: "1787242352"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_LANGUAGE: en
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
        TELEMETRYDECK_APP_ID: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_NAME: FFF
          BUNDLE_DISPLAY_NAME: FFF
          PRODUCT_BUNDLE_IDENTIFIER: app.pulse.mac.dev
          ENABLE_HARDENED_RUNTIME: false
          ENABLE_USER_SCRIPT_SANDBOXING: false
          # Keep direct Xcode builds on the daily app's persistent local signer too.
          # scripts/dev-mac.sh discovers this identity or a contributor's Apple identity.
          CODE_SIGN_IDENTITY: "Fight For Free Local Development"
          DEVELOPMENT_TEAM: ""
        Release:
          PRODUCT_NAME: FFF
          BUNDLE_DISPLAY_NAME: FFF
          PRODUCT_BUNDLE_IDENTIFIER: app.pulse.mac

  PulseIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PulseIOS/Sources
      - path: SharedAppSupport
      - path: PulseMac/Sources/TradingEventsController.swift
      - path: PulseMac/Sources/PositionPoolPresentation.swift
      - path: PulseMac/Sources/WorkbenchSelfTest.swift
      - path: PulseIOS/Resources
        optional: true
      - path: PulseMac/Resources/zh-Hans.lproj
        type: folder
    dependencies:
      - package: PulseCore
      - package: PulseUI
      - package: PulseMobile
      - package: PulseSync
      - package: PulseActivity
      - target: PulseWidgets
        embed: true
    info:
      path: PulseIOS/Info.plist
      properties:
        CFBundleDisplayName: FFF
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: app.pulse.ios
            CFBundleURLSchemes: [fff-pulse]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: FFFiPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.pulse.ios.dev
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_LANGUAGE: zh-Hans
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO

  PulseWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PulseWidgets/Sources
    dependencies:
      - package: PulseActivity
    info:
      path: PulseWidgets/Info.plist
      properties:
        CFBundleDisplayName: FFF盯盘
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: FFFWidgets
        PRODUCT_BUNDLE_IDENTIFIER: app.pulse.ios.dev.widgets
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  PulseIOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - PulseIOSUnitTests
    dependencies:
      - target: PulseIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulse.ios.unittests
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FFFiPhone.app/FFFiPhone"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  PulseIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - PulseIOSUITests
    dependencies:
      - target: PulseIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulse.ios.uitests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: PulseIOS
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  PulseIOS:
    build:
      targets:
        PulseIOS: all
    test:
      targets:
        - PulseIOSUnitTests
        - PulseIOSUITests
